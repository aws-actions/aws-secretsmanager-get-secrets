name: 'AWS Secrets Manager GitHub Action'
author: 'AWS Secrets Manager'
description: 'GitHub action for retrieving secrets from AWS Secrets Manager'
branding:
  icon: 'cloud'
  color: 'orange'
inputs:
  secret-ids:
    description: 'One or more secret names, secret ARNs, or secret prefixes to retrieve'
    required: true
  parse-json-secrets:
    description: '(Optional) If true, JSON secrets will be deserialized, creating a secret environment variable for each key-value pair.'
    required: false
    default: 'false'
  name-transformation:
    description: '(Optional) Transforms environment variable name. Options: uppercase, lowercase, none. Default value: uppercase.'
    required: false
    default: 'uppercase'
  auto-select-family-attempt-timeout:
    description: '(Optional) Timeout (ms) for dual-stack DNS first IP connection attempt. Needed for geographically distant GitHub action workers'
    required: false
    default: '1000'
  http-proxy:
    description: '(Optional) HTTP or HTTPS proxy URL to route Secrets Manager API calls through, e.g. http://proxy.example.com:3128. Defaults to the https_proxy/HTTPS_PROXY or http_proxy/HTTP_PROXY environment variable. Set no-proxy to "*" to ignore a proxy from the environment.'
    required: false
  no-proxy:
    description: '(Optional) Comma-separated hosts that bypass the proxy, e.g. .amazonaws.com, or "*" for all hosts. Defaults to the no_proxy/NO_PROXY environment variable. Only used when a proxy is configured.'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/cleanup/index.js'
