name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Unit Tests
        run: |
          npm ci
          npm run test
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          use_oidc: true

  uppercase-transformation-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Act
        uses: ./
        with:
          name-transformation: uppercase
          parse-json-secrets: true
          secret-ids: |
            SampleSecret1
            /special/chars/secret
            0/special/chars/secret
            PrefixSecret*
            JsonSecret
            SAMPLESECRET1_ALIAS, SampleSecret1
      - name: Assert
        run: npm run integration-test __integration_tests__/name_transformation/uppercase.test.ts

  lowercase-transformation-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Act
        uses: ./
        with:
          name-transformation: lowercase
          parse-json-secrets: true
          secret-ids: |
            SampleSecret1
            /special/chars/secret
            0/special/chars/secret
            PrefixSecret*
            JsonSecret
            samplesecret1_alias, SampleSecret1
      - name: Assert
        run: npm run integration-test __integration_tests__/name_transformation/lowercase.test.ts

  none-transformation-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Act
        uses: ./
        with:
          name-transformation: none
          parse-json-secrets: true
          secret-ids: |
            SampleSecret1
            /special/chars/secret
            0/special/chars/secret
            PrefixSecret*
            JsonSecret
            SampleSecret1_Alias, SampleSecret1
      - name: Assert
        run: npm run integration-test __integration_tests__/name_transformation/none.test.ts

  default-name-transformation-param-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Act
        uses: ./
        with:
          parse-json-secrets: true
          secret-ids: |
            SampleSecret1
            /special/chars/secret
            0/special/chars/secret
            PrefixSecret*
            JsonSecret
            SAMPLESECRET1_ALIAS, SampleSecret1
      - name: Assert
        run: npm run integration-test __integration_tests__/name_transformation/uppercase.test.ts

  default-parse-json-secrets-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Act
        uses: ./
        with:
          secret-ids: JsonSecret
      - name: Assert Default Is No Json Secrets
        run: npm run integration-test __integration_tests__/parse_json_secrets.test.ts

  af-south-1-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
        with:
          aws-region: af-south-1
      - name: Act
        uses: ./
        with:
          secret-ids: JsonSecret
          auto-select-family-attempt-timeout: "2000"
      - name: Assert
        run: npm run integration-test __integration_tests__/parse_json_secrets.test.ts

  # The http-proxy jobs run the action against tinyproxy on the runner and check its log of CONNECT requests.
  http-proxy-input-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Install tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get -y install tinyproxy
      - name: Start tinyproxy
        run: |
          sudo cp .github/integ_tests/tinyproxy.conf /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy
          timeout 10 bash -c 'until ss -ltn | grep -q ":9999 "; do sleep 0.2; done'
      - name: Act
        uses: ./
        with:
          secret-ids: JsonSecret
          http-proxy: http://127.0.0.1:9999
      - name: Assert the secret was retrieved
        run: npm run integration-test __integration_tests__/parse_json_secrets.test.ts
      - name: Assert the request went through the proxy
        run: |
          sudo cat /var/log/tinyproxy/tinyproxy.log
          sudo grep -q "CONNECT secretsmanager.us-east-1.amazonaws.com:443" /var/log/tinyproxy/tinyproxy.log
          sudo grep -q 'Established connection to host "secretsmanager.us-east-1.amazonaws.com"' /var/log/tinyproxy/tinyproxy.log

  http-proxy-env-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Install tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get -y install tinyproxy
      - name: Start tinyproxy
        run: |
          sudo cp .github/integ_tests/tinyproxy.conf /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy
          timeout 10 bash -c 'until ss -ltn | grep -q ":9999 "; do sleep 0.2; done'
      - name: Act
        uses: ./
        env:
          HTTPS_PROXY: 127.0.0.1:9999
        with:
          secret-ids: JsonSecret
      - name: Assert the secret was retrieved
        run: npm run integration-test __integration_tests__/parse_json_secrets.test.ts
      - name: Assert the request went through the proxy
        run: |
          sudo cat /var/log/tinyproxy/tinyproxy.log
          sudo grep -q "CONNECT secretsmanager.us-east-1.amazonaws.com:443" /var/log/tinyproxy/tinyproxy.log
          sudo grep -q 'Established connection to host "secretsmanager.us-east-1.amazonaws.com"' /var/log/tinyproxy/tinyproxy.log

  http-proxy-no-proxy-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Install tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get -y install tinyproxy
      - name: Start tinyproxy
        run: |
          sudo cp .github/integ_tests/tinyproxy.conf /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy
          timeout 10 bash -c 'until ss -ltn | grep -q ":9999 "; do sleep 0.2; done'
      - name: Act with the endpoint in no-proxy
        uses: ./
        with:
          secret-ids: JsonSecret
          http-proxy: http://127.0.0.1:9999
          no-proxy: localhost,.AmazonAWS.com
      - name: Assert the secret was retrieved without the proxy
        run: |
          npm run integration-test __integration_tests__/parse_json_secrets.test.ts
          sudo cat /var/log/tinyproxy/tinyproxy.log
          if sudo grep -q "secretsmanager" /var/log/tinyproxy/tinyproxy.log; then
            echo "The request was sent through the proxy although the endpoint matches no-proxy"
            exit 1
          fi
      - name: Act with no-proxy not covering the endpoint
        uses: ./
        with:
          secret-ids: JSONSECRET_VIA_PROXY,JsonSecret
          http-proxy: http://127.0.0.1:9999
          no-proxy: localhost,127.0.0.1,.internal.example.com
      - name: Assert the second request went through the proxy
        run: |
          [ -n "${JSONSECRET_VIA_PROXY:-}" ] || { echo "JSONSECRET_VIA_PROXY was not exported"; exit 1; }
          sudo cat /var/log/tinyproxy/tinyproxy.log
          sudo grep -q 'Established connection to host "secretsmanager.us-east-1.amazonaws.com"' /var/log/tinyproxy/tinyproxy.log

  http-proxy-auth-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Install tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get -y install tinyproxy
      - name: Start tinyproxy that requires a login
        run: |
          sudo cp .github/integ_tests/tinyproxy-basic-auth.conf /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy
          timeout 10 bash -c 'until ss -ltn | grep -q ":9999 "; do sleep 0.2; done'
      - name: Act with the right credentials
        uses: ./
        with:
          secret-ids: JsonSecret
          # %65 is 'e': the password only works if the action decodes it
          http-proxy: http://alice:s3cr%65t-pw@127.0.0.1:9999
      - name: Assert the secret was retrieved through the proxy
        run: |
          npm run integration-test __integration_tests__/parse_json_secrets.test.ts
          sudo cat /var/log/tinyproxy/tinyproxy.log
          sudo grep -q 'Established connection to host "secretsmanager.us-east-1.amazonaws.com"' /var/log/tinyproxy/tinyproxy.log
          sudo truncate -s 0 /var/log/tinyproxy/tinyproxy.log
      - name: Act with the wrong credentials
        id: act-wrong
        uses: ./
        continue-on-error: true
        with:
          secret-ids: JSONSECRET_WRONG_CREDENTIALS,JsonSecret
          http-proxy: http://alice:wrong-pw@127.0.0.1:9999
      - name: Assert the action failed after the proxy refused the login
        run: |
          sudo cat /var/log/tinyproxy/tinyproxy.log
          if [ "${{ steps.act-wrong.outcome }}" != "failure" ]; then
            echo "The action succeeded with wrong proxy credentials"
            exit 1
          fi
          if [ -n "${JSONSECRET_WRONG_CREDENTIALS:-}" ]; then
            echo "The secret was retrieved with wrong proxy credentials"
            exit 1
          fi
          sudo grep -q "CONNECT secretsmanager.us-east-1.amazonaws.com:443" /var/log/tinyproxy/tinyproxy.log
          if sudo grep -q "Established connection" /var/log/tinyproxy/tinyproxy.log; then
            echo "The proxy established a tunnel although the credentials were wrong"
            exit 1
          fi

  http-proxy-unreachable-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Act
        id: act
        uses: ./
        continue-on-error: true
        with:
          secret-ids: JsonSecret
          http-proxy: http://127.0.0.1:9
      - name: Assert the action failed instead of connecting directly
        run: |
          if [ "${{ steps.act.outcome }}" != "failure" ]; then
            echo "The action succeeded although the configured proxy is unreachable"
            exit 1
          fi
          if [ -n "${JSONSECRET:-}" ]; then
            echo "The secret was retrieved although the configured proxy is unreachable"
            exit 1
          fi

  http-proxy-denied-integration-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
      - name: Install tinyproxy
        run: |
          sudo apt-get update
          sudo apt-get -y install tinyproxy
      - name: Start tinyproxy that refuses tunnels
        run: |
          sudo cp .github/integ_tests/tinyproxy-refuse-connect.conf /etc/tinyproxy/tinyproxy.conf
          sudo systemctl restart tinyproxy
          timeout 10 bash -c 'until ss -ltn | grep -q ":9999 "; do sleep 0.2; done'
      - name: Act
        id: act
        uses: ./
        continue-on-error: true
        with:
          secret-ids: JsonSecret
          http-proxy: http://127.0.0.1:9999
      - name: Assert the action failed after the proxy refused the destination
        run: |
          sudo cat /var/log/tinyproxy/tinyproxy.log
          if [ "${{ steps.act.outcome }}" != "failure" ]; then
            echo "The action succeeded although the proxy refuses CONNECT requests"
            exit 1
          fi
          if [ -n "${JSONSECRET:-}" ]; then
            echo "The secret was retrieved although the proxy refuses CONNECT requests"
            exit 1
          fi
          sudo grep -q "CONNECT secretsmanager.us-east-1.amazonaws.com:443" /var/log/tinyproxy/tinyproxy.log
          sudo grep -q "Refused CONNECT method on port 443" /var/log/tinyproxy/tinyproxy.log
          if sudo grep -q "Established connection" /var/log/tinyproxy/tinyproxy.log; then
            echo "The proxy established a tunnel although CONNECT is disabled"
            exit 1
          fi
